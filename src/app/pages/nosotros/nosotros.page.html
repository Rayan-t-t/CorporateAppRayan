<ion-card>
  <ion-card-header>
    <ion-card-title>
      Nuestra empresa
    </ion-card-title>
  </ion-card-header>
  <ion-card-content>
    Empresa especializada en
    soluciones basadas en Angular,
    Ionic y Node.js.
    <p>
      Distancia a nuestras oficinas:
      {{ distancia() | number:'1.2-2' }} km
    </p>
    <p *ngIf="errorUbicacion()" role="alert">{{ errorUbicacion() }}</p>
  </ion-card-content>
</ion-card>
